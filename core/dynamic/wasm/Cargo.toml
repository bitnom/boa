[package]
name = "boa_dynamic_wasm"
version = "0.20.0"
authors = ["boa-dev"]
description = "WASM bindings for Boa's dynamic runtime interop capabilities"
repository = "https://github.com/boa-dev/boa"
homepage = "https://boajs.dev"
license = "Unlicense OR MIT"
edition = "2021"
rust-version = "1.70"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
boa_dynamic = { version = "0.20", path = ".." }
boa_engine = { version = "0.20", path = "../../engine" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.5"
console_error_panic_hook = "0.1"

[dev-dependencies]
wasm-bindgen-test = "0.3"
